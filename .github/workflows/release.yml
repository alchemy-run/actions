name: Release NPM Package (reusable)

# Reusable workflow that bumps versions across a set of publishable
# workspace packages, commits + tags, publishes each to npm with OIDC
# trusted publishing in dependency-graph order (waves), then cuts a
# GitHub Release and notifies Discord.
#
# Publish order is derived automatically from each package.json's
# `workspace:*` deps to other publishables, so consumers don't have to
# declare it. See compute-waves.ts.
#
# See README.md in this repo for the calling-side example.

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Single string describing what to publish. Channel is inferred:

            ""                    next beta (auto-increment)
            patch | minor | major bump stable from current max on npm
            x.y.z                 explicit stable release
            beta | beta.N         next/forced beta on <current-version>
            alpha | alpha.N       next/forced alpha on <current-version>
            rc | rc.N             next/forced release candidate
            <tag-name>            tag release → version `0.0.0-<tag-name>`
                                  (skips git commit/tag/GitHub Release)

          Tag releases ALWAYS use 0.0.0-<name>; semver-shaped tag specs
          (e.g. `2.0.0-experimental`) are rejected — pass just the name.
        required: false
        type: string
        default: ""
      repo:
        description: "<owner>/<repo> of the caller, e.g. alchemy-run/alchemy-effect"
        required: true
        type: string
      current-version:
        description: "Anchor version for prerelease bumps, e.g. 2.0.0"
        required: true
        type: string
      packages:
        description: >-
          JSON array of `{ "dir": "...", "name": "...", "runner": "..." }`
          objects, one per publishable workspace package. `runner` is
          optional (defaults to `ubuntu-latest`) and overrides the
          GitHub runner used for that package's publish job. Publish
          order is computed from each package.json's workspace deps —
          array order doesn't matter.
        required: true
        type: string
      build-mode:
        description: >-
          When to build:
            `up-front`    — one global build in the bump job (faster
                            overall when packages share build state but
                            requires every package to fit on one runner).
            `per-package` — each publish job builds its own package in
                            its own dir (use this when total build is
                            too large for one runner, or when you want
                            larger runners for specific packages).
        required: false
        type: string
        default: up-front
      build-command:
        description: >-
          Build command. In `up-front` mode it runs once at the repo
          root in the bump job; in `per-package` mode it runs inside
          each package's own dir from each publish-wave matrix job.
        required: false
        type: string
        default: "bun run build:packages"
      node-version:
        description: "Node version"
        required: false
        type: string
        default: "24"
      actions-ref:
        description: >-
          Optional override for the alchemy-run/actions ref used by the
          release scripts. Defaults to the exact commit containing this
          reusable workflow.
        required: false
        type: string
        default: ""
      submodules:
        description: >-
          Passed through to actions/checkout's `submodules` for every
          consumer checkout (`false` | `true` | `recursive`). Needed
          when the consumer's bun workspace includes packages from a
          submodule.
        required: false
        type: string
        default: "false"
      force-latest:
        description: >-
          Publish every package under npm's `latest` dist-tag, whatever
          the channel — use to promote a prerelease (e.g. an rc) to
          latest. The channel's own tag (e.g. `next`) is moved onto the
          version too; that secondary move needs an NPM_TOKEN secret
          (OIDC only covers `npm publish`) and degrades to a workflow
          warning without one. If a version is already on the registry,
          its tags are moved rather than the publish being skipped.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  ACTIONS_DIR: .alchemy-actions
  ALCHEMY_REPO: ${{ inputs.repo }}
  ALCHEMY_CURRENT_VERSION: ${{ inputs.current-version }}

jobs:
  # ── Step 1: Compute the next version, the publish DAG, and stage the
  # bump in-memory. No git commit: a failed publish leaves no orphan
  # commit behind. The staged files ride to the publish jobs as an
  # artifact.
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      channel: ${{ steps.bump.outputs.channel }}
      sha: ${{ steps.sha.outputs.sha }}
      dirs: ${{ steps.parse.outputs.dirs }}
      names: ${{ steps.parse.outputs.names }}
      wave1: ${{ steps.waves.outputs.wave1 }}
      wave2: ${{ steps.waves.outputs.wave2 }}
      wave3: ${{ steps.waves.outputs.wave3 }}
      wave4: ${{ steps.waves.outputs.wave4 }}
    env:
      VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: ${{ inputs.submodules }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.actions-ref || job.workflow_sha }}
          path: ${{ env.ACTIONS_DIR }}

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: parse
        env:
          PACKAGES_JSON: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          DIRS=$(printf '%s' "$PACKAGES_JSON" | jq -c '[.[].dir]')
          NAMES=$(printf '%s' "$PACKAGES_JSON" | jq -c '[.[].name]')
          {
            echo "dirs=$DIRS"
            echo "names=$NAMES"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.alchemy-actions/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org/

      - name: Install actions deps
        working-directory: ${{ env.ACTIONS_DIR }}
        run: bun install

      - id: bump
        env:
          ALCHEMY_PUBLISHABLE_DIRS: ${{ steps.parse.outputs.dirs }}
          ALCHEMY_PUBLISHABLE_NAMES: ${{ steps.parse.outputs.names }}
        run: |
          set -euo pipefail
          # bump.ts emits `channel=<...>` and `version=<...>` on stdout
          # so we can pipe straight into the step outputs file.
          bun "$ACTIONS_DIR/scripts/release/bump.ts" "$VERSION_INPUT" \
            | tee -a "$GITHUB_OUTPUT"

      # Compute waves AFTER bump so the package.json reads see the
      # freshly-written workspace versions (not strictly required for
      # the DAG itself, but keeps the script self-consistent). Pass the
      # full PACKAGES_JSON so per-package `runner` and any other fields
      # ride into the wave outputs.
      - id: waves
        env:
          ALCHEMY_PUBLISHABLE_PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          out=$(bun "$ACTIONS_DIR/scripts/release/compute-waves.ts")
          echo "Computed publish DAG:"
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

      - name: Build packages
        if: inputs.build-mode == 'up-front'
        run: ${{ inputs.build-command }}

      - id: artifact-paths
        env:
          DIRS: ${{ steps.parse.outputs.dirs }}
          BUILD_MODE: ${{ inputs.build-mode }}
        run: |
          set -euo pipefail
          # Always include package.jsons + lockfile. Add lib/bin only
          # when we built up-front so per-package mode doesn't try to
          # upload nonexistent dirs.
          if [ "$BUILD_MODE" = "up-front" ]; then
            PATHS=$(printf '%s' "$DIRS" | jq -r '
              .[] as $d
              | "\($d)/package.json", "\($d)/lib", "\($d)/bin"')
          else
            PATHS=$(printf '%s' "$DIRS" | jq -r '.[] as $d | "\($d)/package.json"')
          fi
          PATHS="${PATHS}
          bun.lock"
          {
            echo "paths<<EOF"
            echo "$PATHS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bump-files
          path: ${{ steps.artifact-paths.outputs.paths }}
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true

  # ── Step 2: Commit (bump + changelog) and tag BEFORE publishing. ──
  # Committing first means the publishable source of truth is the tagged
  # commit; publish jobs check it out by SHA. Skipped for `tag` channel.
  commit-and-tag:
    needs: bump
    if: needs.bump.outputs.channel != 'tag'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ALCHEMY_VERSION_BOT_ID }}
          private-key: ${{ secrets.ALCHEMY_VERSION_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token }}
          submodules: ${{ inputs.submodules }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.actions-ref || job.workflow_sha }}
          path: ${{ env.ACTIONS_DIR }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bump-files

      - uses: ./.alchemy-actions/actions/setup
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install actions deps
        working-directory: ${{ env.ACTIONS_DIR }}
        run: bun install

      - name: Configure git
        run: |
          git config user.email "alchemy-version-bot[bot]@users.noreply.github.com"
          git config user.name "alchemy-version-bot[bot]"

      - id: commit
        name: Commit bump + changelog, tag, push
        env:
          VERSION: ${{ needs.bump.outputs.version }}
          DIRS: ${{ needs.bump.outputs.dirs }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          HEAD_TAG=$(git describe --exact-match --tags HEAD 2>/dev/null || true)
          if [ "$HEAD_TAG" = "$TAG" ]; then
            echo "HEAD is already at ${TAG}; skipping commit/tag/push"
            SHA=$(git rev-parse HEAD)
            echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bun "$ACTIONS_DIR/scripts/release/release-notes.ts" "${TAG}"

          mapfile -t PKG_JSONS < <(printf '%s' "$DIRS" | jq -r '.[] | "\(.)/package.json"')
          git add "${PKG_JSONS[@]}" bun.lock CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No changes to commit (already on a release commit?)"
          else
            git commit -m "chore(release): ${VERSION}"
          fi

          if ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag -a "${TAG}" -m "Release ${TAG}"
          fi

          git push origin HEAD
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already on remote, skipping tag push"
          else
            git push origin "refs/tags/${TAG}"
          fi

          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  # ── Step 3: Publish in waves. Each wave is a matrix of packages that
  # publish in parallel. Wave N+1 is gated on wave N succeeding (or
  # skipping). GitHub Actions can't dynamically generate jobs, so we
  # pre-declare a fixed set of waves and skip empty ones. Four covers
  # every current consumer (cloudflare-tools is the deepest at 4). If
  # you genuinely need depth ≥ 5, bump MAX_WAVES in compute-waves.ts
  # and add publish-wave-5 (… etc.) here.
  publish-wave-1:
    name: wave-1 / ${{ matrix.package.name }}
    needs: [bump, commit-and-tag]
    if: >-
      always() && needs.bump.result == 'success' &&
      (needs.commit-and-tag.result == 'success' ||
       needs.commit-and-tag.result == 'skipped') &&
      needs.bump.outputs.wave1 != '[]'
    runs-on: ${{ matrix.package.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.bump.outputs.wave1) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.actions-ref || job.workflow_sha }}
          path: ${{ env.ACTIONS_DIR }}
      - uses: ./.alchemy-actions/actions/publish
        with:
          ref: ${{ needs.commit-and-tag.outputs.sha || needs.bump.outputs.sha }}
          actions-repository: ${{ job.workflow_repository }}
          actions-ref: ${{ inputs.actions-ref || job.workflow_sha }}
          dir: ${{ matrix.package.dir }}
          channel: ${{ needs.bump.outputs.channel }}
          dirs-json: ${{ needs.bump.outputs.dirs }}
          names-json: ${{ needs.bump.outputs.names }}
          force-latest: ${{ inputs.force-latest }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          build-command: ${{ inputs.build-mode == 'per-package' && inputs.build-command || '' }}
          node-version: ${{ inputs.node-version }}
          submodules: ${{ inputs.submodules }}

  publish-wave-2:
    name: wave-2 / ${{ matrix.package.name }}
    needs: [bump, commit-and-tag, publish-wave-1]
    if: >-
      always() && needs.bump.result == 'success' &&
      (needs.commit-and-tag.result == 'success' ||
       needs.commit-and-tag.result == 'skipped') &&
      (needs.publish-wave-1.result == 'success' ||
       needs.publish-wave-1.result == 'skipped') &&
      needs.bump.outputs.wave2 != '[]'
    runs-on: ${{ matrix.package.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.bump.outputs.wave2) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.actions-ref || job.workflow_sha }}
          path: ${{ env.ACTIONS_DIR }}
      - uses: ./.alchemy-actions/actions/publish
        with:
          ref: ${{ needs.commit-and-tag.outputs.sha || needs.bump.outputs.sha }}
          actions-repository: ${{ job.workflow_repository }}
          actions-ref: ${{ inputs.actions-ref || job.workflow_sha }}
          dir: ${{ matrix.package.dir }}
          channel: ${{ needs.bump.outputs.channel }}
          dirs-json: ${{ needs.bump.outputs.dirs }}
          names-json: ${{ needs.bump.outputs.names }}
          force-latest: ${{ inputs.force-latest }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          build-command: ${{ inputs.build-mode == 'per-package' && inputs.build-command || '' }}
          node-version: ${{ inputs.node-version }}
          submodules: ${{ inputs.submodules }}

  publish-wave-3:
    name: wave-3 / ${{ matrix.package.name }}
    needs: [bump, commit-and-tag, publish-wave-1, publish-wave-2]
    if: >-
      always() && needs.bump.result == 'success' &&
      (needs.commit-and-tag.result == 'success' ||
       needs.commit-and-tag.result == 'skipped') &&
      (needs.publish-wave-1.result == 'success' ||
       needs.publish-wave-1.result == 'skipped') &&
      (needs.publish-wave-2.result == 'success' ||
       needs.publish-wave-2.result == 'skipped') &&
      needs.bump.outputs.wave3 != '[]'
    runs-on: ${{ matrix.package.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.bump.outputs.wave3) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.actions-ref || job.workflow_sha }}
          path: ${{ env.ACTIONS_DIR }}
      - uses: ./.alchemy-actions/actions/publish
        with:
          ref: ${{ needs.commit-and-tag.outputs.sha || needs.bump.outputs.sha }}
          actions-repository: ${{ job.workflow_repository }}
          actions-ref: ${{ inputs.actions-ref || job.workflow_sha }}
          dir: ${{ matrix.package.dir }}
          channel: ${{ needs.bump.outputs.channel }}
          dirs-json: ${{ needs.bump.outputs.dirs }}
          names-json: ${{ needs.bump.outputs.names }}
          force-latest: ${{ inputs.force-latest }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          build-command: ${{ inputs.build-mode == 'per-package' && inputs.build-command || '' }}
          node-version: ${{ inputs.node-version }}
          submodules: ${{ inputs.submodules }}

  publish-wave-4:
    name: wave-4 / ${{ matrix.package.name }}
    needs: [bump, commit-and-tag, publish-wave-1, publish-wave-2, publish-wave-3]
    if: >-
      always() && needs.bump.result == 'success' &&
      (needs.commit-and-tag.result == 'success' ||
       needs.commit-and-tag.result == 'skipped') &&
      (needs.publish-wave-1.result == 'success' ||
       needs.publish-wave-1.result == 'skipped') &&
      (needs.publish-wave-2.result == 'success' ||
       needs.publish-wave-2.result == 'skipped') &&
      (needs.publish-wave-3.result == 'success' ||
       needs.publish-wave-3.result == 'skipped') &&
      needs.bump.outputs.wave4 != '[]'
    runs-on: ${{ matrix.package.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.bump.outputs.wave4) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.actions-ref || job.workflow_sha }}
          path: ${{ env.ACTIONS_DIR }}
      - uses: ./.alchemy-actions/actions/publish
        with:
          ref: ${{ needs.commit-and-tag.outputs.sha || needs.bump.outputs.sha }}
          actions-repository: ${{ job.workflow_repository }}
          actions-ref: ${{ inputs.actions-ref || job.workflow_sha }}
          dir: ${{ matrix.package.dir }}
          channel: ${{ needs.bump.outputs.channel }}
          dirs-json: ${{ needs.bump.outputs.dirs }}
          names-json: ${{ needs.bump.outputs.names }}
          force-latest: ${{ inputs.force-latest }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          build-command: ${{ inputs.build-mode == 'per-package' && inputs.build-command || '' }}
          node-version: ${{ inputs.node-version }}
          submodules: ${{ inputs.submodules }}

  # ── Step 4: Create GitHub Release and notify Discord. ──
  # Runs only when every non-empty publish wave succeeded.
  finalize:
    needs:
      [
        bump,
        commit-and-tag,
        publish-wave-1,
        publish-wave-2,
        publish-wave-3,
        publish-wave-4,
      ]
    if: >-
      always() && needs.bump.outputs.channel != 'tag' &&
      needs.commit-and-tag.result == 'success' &&
      (needs.publish-wave-1.result == 'success' ||
       needs.publish-wave-1.result == 'skipped') &&
      (needs.publish-wave-2.result == 'success' ||
       needs.publish-wave-2.result == 'skipped') &&
      (needs.publish-wave-3.result == 'success' ||
       needs.publish-wave-3.result == 'skipped') &&
      (needs.publish-wave-4.result == 'success' ||
       needs.publish-wave-4.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.commit-and-tag.outputs.sha }}
          fetch-depth: 0

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.actions-ref || job.workflow_sha }}
          path: ${{ env.ACTIONS_DIR }}

      - uses: ./.alchemy-actions/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          install: "false"

      - name: Install actions deps
        working-directory: ${{ env.ACTIONS_DIR }}
        run: bun install

      - name: Create GitHub Release
        env:
          VERSION: ${{ needs.bump.outputs.version }}
          CHANNEL: ${{ needs.bump.outputs.channel }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun "$ACTIONS_DIR/scripts/release/github-release.ts" "v${VERSION}" "${CHANNEL}"

      - name: Notify Discord
        if: success() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.bump.outputs.version }}
          CHANNEL: ${{ needs.bump.outputs.channel }}
        run: bun "$ACTIONS_DIR/scripts/release/discord-notify.ts" "v${VERSION}" "${CHANNEL}"
