name: pr-package (reusable)

# Reusable workflow that publishes a complete set of per-commit tarballs
# to a pr-package service (default pkg.ing) instead of npm. No commit or
# GitHub Release.
#
# Behaviour:
#   - push to main / force-ci label  → republish every package
#   - pull_request                    → diff-driven subset, transitively
#                                       expanded so the workspace-dep
#                                       URL rewriter has a same-SHA
#                                       tarball to point at
#   - pull_request.closed             → no-op. pr-package tags persist
#                                       past PR close so install URLs
#                                       keep resolving; the bucket's
#                                       TTL handles orphan cleanup.
#
# Packages build and pack in parallel after every configured workspace
# dependency is rewritten to a deterministic full-SHA graph URL. Only
# after all tarballs exist do we upload the dependency set, followed by
# public commit, branch, and PR tags.

on:
  workflow_call:
    inputs:
      packages:
        description: >-
          JSON array of `{ "dir": "...", "name": "...", "project": "...",
          "install": "...", "runner": "..." }`. `dir` and `name` are
          required. `project` (defaults to `name`) is used as the
          pr-package project name on upload. `install` (defaults to
          `project`) is the path used in `bun add` URLs and in the
          rewritten workspace-dep URLs. `runner` (defaults to
          `ubuntu-latest`) routes that package to a specific runner.
        required: true
        type: string
      pr-package-host:
        description: "Host the tarballs upload to"
        required: false
        type: string
        default: pkg.ing
      install-host:
        description: >-
          Host shown in the PR-comment install URLs and used as the
          target host when rewriting sibling workspace-deps. Defaults
          to pr-package-host. Useful for projects with a custom CNAME
          like pkg.distilled.cloud.
        required: false
        type: string
        default: ""
      build-command:
        description: >-
          Build command run in each changed package's directory.
          Default `bun run build`; tsc-style project references will
          build deps transitively as a side effect.
        required: false
        type: string
        default: "bun run build"
      node-version:
        description: Node version
        required: false
        type: string
        default: "24"
      actions-ref:
        description: Ref of the alchemy-run/actions repo to check out
        required: false
        type: string
        default: main
      force-ci-label:
        description: "PR label that forces rebuild of every package"
        required: false
        type: string
        default: force-ci
      submodules:
        description: >-
          Passed through to actions/checkout's `submodules` for the
          consumer checkouts in the publish jobs (`false` | `true` |
          `recursive`). Needed when the consumer's bun workspace
          includes packages from a submodule.
        required: false
        type: string
        default: "false"
      rebuild-all-paths:
        description: >-
          Newline-separated paths appended to compute-changed's default
          rebuild-all globs (`bun.lock`, root `package.json`, …). A PR
          touching any of them republishes every package. Use for
          submodule pointers (e.g. `distilled`) whose changes don't
          fall under any package dir.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

env:
  ACTIONS_DIR: .alchemy-actions

jobs:
  # ── Step 1: which packages this run publishes. ──────────────────────
  # push / force-ci → full set. PR → diff-driven subset with
  # transitive workspace-dep closure.
  detect-changes:
    # Skip fork PRs entirely — they can't access PR_PACKAGE_TOKEN or
    # the alchemy-version-bot secrets, so every downstream step would
    # error before doing anything useful. Internal PRs and pushes to
    # main behave as before.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compute.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: ${{ inputs.submodules }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: alchemy-run/actions
          ref: ${{ inputs.actions-ref }}
          path: ${{ env.ACTIONS_DIR }}

      - uses: ./.alchemy-actions/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          install: "false"

      - id: compute
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_LABEL_PRESENT: ${{ contains(github.event.pull_request.labels.*.name, inputs.force-ci-label) }}
          PACKAGES_JSON: ${{ inputs.packages }}
          ALCHEMY_PR_REBUILD_ALL_GLOBS: ${{ inputs.rebuild-all-paths }}
        run: |
          set -euo pipefail

          # Normalise every package entry up front so every downstream
          # job (matrix `runs-on`, the rewrite script, the upload curl)
          # sees the same shape regardless of whether the user supplied
          # `project`/`install`/`runner` explicitly.
          PACKAGES_FULL=$(printf '%s' "$PACKAGES_JSON" | jq -c '
            map({ dir,
                  name,
                  project: (.project // .name),
                  install: (.install // .project // .name),
                  runner:  (.runner  // "ubuntu-latest"),
                  artifact: ("pr-package-" + (.dir | @uri)) })')

          if [ "$EVENT" = "push" ] || [ "$FORCE_LABEL_PRESENT" = "true" ]; then
            [ "$EVENT" = "push" ] \
              && echo "Push event — rebuilding every package." \
              || echo "force-ci label present — rebuilding every package."
            echo "changed=$PACKAGES_FULL" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Diffing $BASE_SHA..$HEAD_SHA"
          DIFF=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          printf '  %s\n' $DIFF || true

          DIRS=$(printf '%s' "$PACKAGES_FULL" | jq -c '[.[].dir]')
          NAMES=$(printf '%s' "$PACKAGES_FULL" | jq -c '[.[].name]')

          AFFECTED=$(printf '%s\n' "$DIFF" \
            | env ALCHEMY_PUBLISHABLE_DIRS="$DIRS" \
                  ALCHEMY_PUBLISHABLE_NAMES="$NAMES" \
                  bun "$ACTIONS_DIR/scripts/release/compute-changed.ts")
          echo "compute-changed result: $AFFECTED"

          # Re-attach the normalised config (project/install/runner) to
          # each affected entry.
          MATRIX=$(jq -nc \
            --argjson packages "$PACKAGES_FULL" \
            --argjson affected "$AFFECTED" '
              ($packages | map({ key: .dir, value: . }) | from_entries) as $byDir
              | $affected.changed
              | map($byDir[.dir])')
          echo "changed=$MATRIX" | tee -a "$GITHUB_OUTPUT"

  # ── Step 2: compute immutable and mutable install/CDN tags. ─────────
  plan:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed != '[]'
    runs-on: ubuntu-latest
    outputs:
      dependency_tag: ${{ steps.tags.outputs.dependency_tag }}
      tags: ${{ steps.tags.outputs.tags }}
      short: ${{ steps.tags.outputs.short }}
      sha: ${{ steps.tags.outputs.sha }}
    steps:
      - id: tags
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          short="${SHA:0:7}"
          long="$SHA"
          dependency_tag="graph-${long}"
          tags=("$short" "$long" "$BRANCH")
          [ "$EVENT" = "pull_request" ] && tags+=("pr-${PR_NUMBER}")
          tags_json=$(printf '%s\n' "${tags[@]}" | jq -R . | jq -s -c .)
          {
            echo "dependency_tag=$dependency_tag"
            echo "tags=$tags_json"
            echo "short=$short"
            echo "sha=$long"
          } | tee -a "$GITHUB_OUTPUT"

  # ── Step 3: build and pack the complete graph in one parallel pass. ─
  pack:
    name: pack / ${{ matrix.package.name }}
    needs: [detect-changes, plan]
    if: needs.detect-changes.outputs.changed != '[]'
    runs-on: ${{ matrix.package.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.changed) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: ${{ inputs.submodules }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: alchemy-run/actions
          ref: ${{ inputs.actions-ref }}
          path: ${{ env.ACTIONS_DIR }}

      - uses: ./.alchemy-actions/actions/setup
        with:
          node-version: ${{ inputs.node-version }}

      - name: Build ${{ matrix.package.name }}
        working-directory: ${{ matrix.package.dir }}
        run: ${{ inputs.build-command }}

      - name: Pin sibling workspace deps to same-graph URLs
        env:
          ALCHEMY_PUBLISHABLE_PACKAGES: ${{ inputs.packages }}
          ALCHEMY_PR_INSTALL_HOST: ${{ inputs.install-host || inputs.pr-package-host }}
          ALCHEMY_PR_TAG: ${{ needs.plan.outputs.dependency_tag }}
        run: bun "$ACTIONS_DIR/scripts/release/rewrite-pr-package-deps.ts" "${{ matrix.package.dir }}"

      - name: Pack ${{ matrix.package.name }}
        working-directory: ${{ matrix.package.dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -f -- *.tgz
          bun pm pack --destination .
          tgz=( *.tgz )
          [ "${#tgz[@]}" -eq 1 ] || {
            echo "Expected exactly one tarball, found ${#tgz[@]}" >&2
            exit 1
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package.artifact }}
          path: ${{ matrix.package.dir }}/*.tgz
          if-no-files-found: error
          retention-days: 1

  # ── Step 4: publish the immutable set, then expose mutable tags. ────
  publish:
    needs: [detect-changes, plan, pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: alchemy-run/actions
          ref: ${{ inputs.actions-ref }}
          path: ${{ env.ACTIONS_DIR }}

      - uses: ./.alchemy-actions/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          install: "false"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pr-package-*
          path: .pr-packages

      - name: Publish complete package graph
        env:
          CHANGED: ${{ needs.detect-changes.outputs.changed }}
          DEPENDENCY_TAG: ${{ needs.plan.outputs.dependency_tag }}
          TAGS: ${{ needs.plan.outputs.tags }}
          PR_PACKAGE_HOST: ${{ inputs.pr-package-host }}
          TOKEN: ${{ secrets.PR_PACKAGE_TOKEN }}
          TTL: ${{ github.event_name == 'pull_request' && '1 week' || '' }}
        run: bun "$ACTIONS_DIR/scripts/release/publish-pr-package-graph.ts"

  # ── PR-only: sticky install-instructions comment. ───────────────────
  comment:
    needs: [detect-changes, plan, publish]
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.changed != '[]' &&
      needs.plan.result == 'success' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ALCHEMY_VERSION_BOT_ID }}
          private-key: ${{ secrets.ALCHEMY_VERSION_BOT_PRIVATE_KEY }}

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHORT_SHA: ${{ needs.plan.outputs.short }}
          INSTALL_HOST: ${{ inputs.install-host || inputs.pr-package-host }}
          CHANGED: ${{ needs.detect-changes.outputs.changed }}
        run: |
          set -euo pipefail
          MARKER="<!-- pr-package-comment -->"

          {
            printf '%s\n\n' "$MARKER"
            printf 'Install the packages built from this commit:\n\n'
            printf '%s' "$CHANGED" | jq -r '.[] | @json' | while IFS= read -r row; do
              name=$(printf '%s' "$row" | jq -r '.name')
              install=$(printf '%s' "$row" | jq -r '.install')
              printf '**%s**\n' "$name"
              printf '```sh\n'
              printf 'bun add %s@https://%s/%s/%s\n' "$name" "$INSTALL_HOST" "$install" "$SHORT_SHA"
              printf '```\n\n'
            done
          } > /tmp/pr-package-body.md

          BODY=$(cat /tmp/pr-package-body.md)

          existing=$(gh api --paginate \
            "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"alchemy-version-bot[bot]\") | select(.body | startswith(\"${MARKER}\")) | .id" \
            | head -1)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="$BODY"
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY"
          fi

  # PR close intentionally does nothing — pr-package tags persist past
  # PR close so existing install URLs keep resolving. The bucket's TTL
  # handles orphan cleanup on its own schedule.
