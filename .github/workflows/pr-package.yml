name: pr-package (reusable)

# Publishes a complete set of per-commit tarballs from one job on one runner.
# Package work is derived from config at runtime, so adding a package does not
# add another matrix job or require another predeclared publish wave.

on:
  workflow_call:
    inputs:
      packages:
        description: >-
          JSON array of `{ "dir": "...", "name": "...", "project": "...",
          "install": "..." }`. `dir` and `name` are required. `project`
          defaults to `name`; `install` defaults to `project`.
        required: true
        type: string
      pr-package-host:
        description: Host the tarballs upload to
        required: false
        type: string
        default: pkg.ing
      install-host:
        description: >-
          Host used by install URLs and rewritten workspace dependencies.
          Defaults to pr-package-host.
        required: false
        type: string
        default: ""
      build-command:
        description: Build command run in each selected package directory
        required: false
        type: string
        default: bun run build
      node-version:
        description: Node version
        required: false
        type: string
        default: "24"
      actions-ref:
        description: >-
          Optional override for the alchemy-run/actions ref used by the
          workflow's scripts. Defaults to the exact commit containing this
          reusable workflow.
        required: false
        type: string
        default: ""
      force-ci-label:
        description: PR label that forces rebuild of every package
        required: false
        type: string
        default: force-ci
      submodules:
        description: >-
          Passed through to actions/checkout's `submodules` (`false` | `true` |
          `recursive`).
        required: false
        type: string
        default: "false"
      rebuild-all-paths:
        description: >-
          Newline-separated paths appended to compute-changed's default
          rebuild-all globs.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

env:
  ACTIONS_DIR: .alchemy-actions

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: ${{ inputs.submodules }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.actions-ref || job.workflow_sha }}
          path: ${{ env.ACTIONS_DIR }}

      - uses: ./.alchemy-actions/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          install: "false"

      - name: Plan package graph
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FORCE_LABEL_PRESENT: ${{ contains(github.event.pull_request.labels.*.name, inputs.force-ci-label) }}
          PACKAGES_JSON: ${{ inputs.packages }}
          PR_PACKAGE_HOST: ${{ inputs.pr-package-host }}
          INSTALL_HOST: ${{ inputs.install-host }}
          ALCHEMY_PR_REBUILD_ALL_GLOBS: ${{ inputs.rebuild-all-paths }}
        run: bun "$ACTIONS_DIR/scripts/release/plan-pr-packages.ts"

      - name: Install dependencies
        if: fromJson(steps.plan.outputs.plan).packages[0] != null
        run: bun install

      - name: Build and pack packages
        if: fromJson(steps.plan.outputs.plan).packages[0] != null
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bun "$ACTIONS_DIR/scripts/release/build-pr-packages.ts"

      - name: Publish complete package graph
        if: fromJson(steps.plan.outputs.plan).packages[0] != null
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          PR_PACKAGE_HOST: ${{ inputs.pr-package-host }}
          TOKEN: ${{ secrets.PR_PACKAGE_TOKEN }}
          TTL: ${{ github.event_name == 'pull_request' && '1 week' || '' }}
        run: bun "$ACTIONS_DIR/scripts/release/publish-pr-package-graph.ts"

      - name: Generate bot token
        if: >-
          github.event_name == 'pull_request' &&
          fromJson(steps.plan.outputs.plan).packages[0] != null
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ALCHEMY_VERSION_BOT_ID }}
          private-key: ${{ secrets.ALCHEMY_VERSION_BOT_PRIVATE_KEY }}

      - name: Comment on PR
        if: >-
          github.event_name == 'pull_request' &&
          fromJson(steps.plan.outputs.plan).packages[0] != null
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PLAN: ${{ steps.plan.outputs.plan }}
        run: bun "$ACTIONS_DIR/scripts/release/comment-pr-packages.ts"

  # Fork PRs and closed PRs intentionally do nothing. Forks cannot access the
  # publishing secrets; tags persist after close until the service TTL expires.
