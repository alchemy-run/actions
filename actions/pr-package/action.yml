name: Publish PR packages
description: Build and publish a complete package graph from one runner.

inputs:
  packages:
    description: >-
      JSON array of package config. Each entry requires dir and name and may
      include group, project, install, and submodule.
    required: true
  pr-package-token:
    description: Bearer token used to upload packages
    required: true
  github-app-id:
    description: GitHub App id used for the sticky PR comment
    required: true
  github-app-private-key:
    description: GitHub App private key used for the sticky PR comment
    required: true
  pr-package-host:
    description: Host the tarballs upload to
    required: false
    default: pkg.ing
  install-host:
    description: Host used by install URLs; defaults to pr-package-host
    required: false
    default: ""
  build-command:
    description: Build command run in each selected package directory
    required: false
    default: bun run build
  node-version:
    description: Node.js version
    required: false
    default: "24"
  bun-version:
    description: Bun version
    required: false
    default: latest
  force-ci-label:
    description: PR label that forces every package to rebuild
    required: false
    default: force-ci
  submodules:
    description: Checkout submodules mode (false, true, or recursive)
    required: false
    default: "false"
  rebuild-all-paths:
    description: Newline-separated paths that cause every package to rebuild
    required: false
    default: ""
  pr-ttl:
    description: Package lifetime for pull request publications
    required: false
    default: 1 week

outputs:
  plan:
    description: Resolved package publication plan
    value: ${{ steps.plan.outputs.plan }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        submodules: ${{ inputs.submodules }}

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Plan package graph
      id: plan
      shell: bash
      env:
        ACTIONS_DIR: ${{ github.action_path }}/../..
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        FORCE_LABEL_PRESENT: ${{ contains(github.event.pull_request.labels.*.name, inputs.force-ci-label) }}
        PACKAGES_JSON: ${{ inputs.packages }}
        PR_PACKAGE_HOST: ${{ inputs.pr-package-host }}
        INSTALL_HOST: ${{ inputs.install-host }}
        ALCHEMY_PR_REBUILD_ALL_GLOBS: ${{ inputs.rebuild-all-paths }}
      run: bun "$ACTIONS_DIR/scripts/release/plan-pr-packages.ts"

    - name: Install dependencies
      if: fromJson(steps.plan.outputs.plan).packages[0] != null
      shell: bash
      run: bun install

    - name: Build and pack packages
      if: fromJson(steps.plan.outputs.plan).packages[0] != null
      shell: bash
      env:
        ACTIONS_DIR: ${{ github.action_path }}/../..
        PLAN: ${{ steps.plan.outputs.plan }}
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: bun "$ACTIONS_DIR/scripts/release/build-pr-packages.ts"

    - name: Publish complete package graph
      if: fromJson(steps.plan.outputs.plan).packages[0] != null
      shell: bash
      env:
        ACTIONS_DIR: ${{ github.action_path }}/../..
        PLAN: ${{ steps.plan.outputs.plan }}
        PR_PACKAGE_HOST: ${{ inputs.pr-package-host }}
        TOKEN: ${{ inputs.pr-package-token }}
        TTL: ${{ github.event_name == 'pull_request' && inputs.pr-ttl || '' }}
      run: bun "$ACTIONS_DIR/scripts/release/publish-pr-package-graph.ts"

    - name: Generate bot token
      if: >-
        github.event_name == 'pull_request' &&
        fromJson(steps.plan.outputs.plan).packages[0] != null
      id: bot-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.github-app-id }}
        private-key: ${{ inputs.github-app-private-key }}

    - name: Comment on PR
      if: >-
        github.event_name == 'pull_request' &&
        fromJson(steps.plan.outputs.plan).packages[0] != null
      shell: bash
      env:
        ACTIONS_DIR: ${{ github.action_path }}/../..
        GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PLAN: ${{ steps.plan.outputs.plan }}
      run: bun "$ACTIONS_DIR/scripts/release/comment-pr-packages.ts"
