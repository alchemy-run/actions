name: Setup
description: Set up Node and Bun, restore Bun and Turbo caches, and run bun install.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "24"
  bun-version:
    description: Bun version
    required: false
    default: latest
  registry-url:
    description: npm registry URL for setup-node
    required: false
    default: ""
  working-directory:
    description: Directory to run `bun install` in
    required: false
    default: .
  install:
    description: Whether to run `bun install`
    required: false
    default: "true"
  turbo-cache:
    description: Whether to restore and save the workspace's local Turbo cache
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - if: inputs.turbo-cache == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ inputs.working-directory }}/.turbo
        key: turbo-${{ runner.os }}-${{ github.repository }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.repository }}-${{ github.sha }}-
          turbo-${{ runner.os }}-${{ github.repository }}-

    - if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install
