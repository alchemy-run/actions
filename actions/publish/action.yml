name: Publish one package
description: Checkout the consumer at the release SHA, download bump-files, optionally build, and publish one package to npm via the shared publish-package.ts.

inputs:
  ref:
    description: SHA of the consumer repo to check out (the release commit)
    required: true
  actions-ref:
    description: Ref of alchemy-run/actions to check out
    required: true
  dir:
    description: Directory of the package to publish
    required: true
  channel:
    description: "release | beta | alpha | rc | tag"
    required: true
  force-latest:
    description: >-
      Publish under npm's `latest` dist-tag regardless of channel. When
      the version is already on the registry, moves `latest` onto it
      instead of skipping.
    required: false
    default: "false"
  dirs-json:
    description: JSON array of ALL publishable dirs (for workspace sibling resolution)
    required: true
  names-json:
    description: JSON array of ALL publishable names (parallel to dirs-json)
    required: true
  build-command:
    description: >-
      Optional build command, run in the package's own `dir`. Used when
      the release workflow is configured with `build-mode: per-package`
      so the build doesn't have to fit on the bump job's runner.
    required: false
    default: ""
  node-version:
    description: Node version
    required: false
    default: "24"
  submodules:
    description: >-
      Passed through to actions/checkout's `submodules` for the consumer
      checkout (`false` | `true` | `recursive`). Needed when the
      consumer's bun workspace includes packages from a submodule.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ inputs.ref }}
        submodules: ${{ inputs.submodules }}

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: alchemy-run/actions
        ref: ${{ inputs.actions-ref }}
        path: .alchemy-actions

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: bump-files

    - uses: ./.alchemy-actions/actions/setup
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org/

    - name: Upgrade npm for OIDC trusted publishing
      shell: bash
      run: |
        npm install -g npm@latest && npm --version
        sed -i '/always-auth/d' ~/.npmrc 2>/dev/null || true

    - name: Install actions deps
      shell: bash
      working-directory: .alchemy-actions
      run: bun install

    - name: Build ${{ inputs.dir }}
      if: inputs.build-command != ''
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: ${{ inputs.build-command }}

    - name: Publish
      shell: bash
      env:
        ALCHEMY_PUBLISHABLE_DIRS: ${{ inputs.dirs-json }}
        ALCHEMY_PUBLISHABLE_NAMES: ${{ inputs.names-json }}
        ALCHEMY_FORCE_LATEST: ${{ inputs.force-latest }}
      run: bun .alchemy-actions/scripts/release/publish-package.ts "${{ inputs.dir }}" "${{ inputs.channel }}"
