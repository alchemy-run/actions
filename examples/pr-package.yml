# Example consumer workflow. Drop into `.github/workflows/pr-package.yml`
# in the consumer repo and adjust `with:` to match the workspace.

name: pr-package

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so adding the `force-ci` label re-triggers the run. We
    # intentionally do NOT listen to `closed` — pr-package tags persist
    # past PR close so existing install URLs keep resolving.
    types: [opened, synchronize, reopened, labeled]

# Reusable workflows can't widen permissions — the caller must grant
# `pull-requests: write` for the sticky install-instructions comment.
permissions:
  contents: read
  pull-requests: write

jobs:
  pr-package:
    uses: alchemy-run/actions/.github/workflows/pr-package.yml@main
    with:
      packages: |
        [
          {
            "dir": "packages/alchemy",
            "name": "alchemy"
          },
          {
            "dir": "packages/better-auth",
            "name": "@alchemy.run/better-auth"
          },
          {
            "dir": "packages/pr-package",
            "name": "@alchemy.run/pr-package"
          }
        ]
    secrets: inherit
