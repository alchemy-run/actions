# Example consumer workflow. Drop into `.github/workflows/release.yml` in
# the consumer repo (alchemy-effect, async-alchemy, distilled, …) and
# adjust `with:` to match the repo's publishable workspace packages.

name: Release NPM Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release spec. Empty = next beta. `patch|minor|major` or `x.y.z`
          for a stable release. `beta` / `beta.N` / `alpha` / `alpha.N`
          for a prerelease. Anything else = tag release on
          `0.0.0-<name>`.
        required: false
        type: string
        default: ""

# Reusable workflows can't widen permissions — the caller must grant
# `contents: write` (commit + tag) and `id-token: write` (npm OIDC).
permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: alchemy-run/actions/.github/workflows/release.yml@main
    with:
      version: ${{ inputs.version }}
      repo: alchemy-run/alchemy-effect
      current-version: "2.0.0"
      packages: |
        [
          { "dir": "packages/alchemy",     "name": "alchemy" },
          { "dir": "packages/better-auth", "name": "@alchemy.run/better-auth" },
          { "dir": "packages/pr-package",  "name": "@alchemy.run/pr-package" }
        ]
    secrets: inherit
